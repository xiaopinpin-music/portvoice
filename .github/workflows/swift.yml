name: Swift Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/swiftui-skeleton

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build PortVoice
        run: swift build
